<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Land Shepherd - Pixel Art Nature Simulation</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <div id="game-container">
        <canvas id="gameCanvas"></canvas>
    </div>
    
    <!-- Time UI Overlay -->
    <div id="time-ui">
        <h3>Time System</h3>
        <div class="time-info">
            <span class="time-label">Day:</span>
            <span class="time-value" id="current-day">0</span>
        </div>
        <div class="time-info">
            <span class="time-label">Speed:</span>
            <span class="time-value" id="time-speed">1x (Normal)</span>
        </div>
        <div class="controls-hint">
            <div><strong>Controls:</strong></div>
            <div>Space: Pause/Resume</div>
            <div>+/-: Adjust speed</div>
            <div>1/2/3: Set speed preset</div>
            <div>0: Pause</div>
        </div>
    </div>
    
    <!-- Nutrient Overlay UI -->
    <div id="overlay-ui">
        <div class="overlay-mode">
            <span class="overlay-label">View:</span>
            <span class="overlay-value" id="overlay-mode">Normal</span>
        </div>
        <div class="overlay-hint" id="overlay-hint">Press F to show nutrient overlays</div>
        <div class="overlay-legend" id="overlay-legend" style="display: none;">
            <div class="legend-title">Nutrient Scale</div>
            <div class="legend-gradient">
                <div class="legend-color" style="background: rgb(255,50,50);"></div>
                <div class="legend-color" style="background: rgb(255,255,50);"></div>
                <div class="legend-color" style="background: rgb(50,255,50);"></div>
            </div>
            <div class="legend-labels">
                <span>Low (0)</span>
                <span>Mid (50)</span>
                <span>High (100)</span>
            </div>
        </div>
    </div>
    
    <!-- Charger les modules dans l'ordre correct -->
    <!-- Core systems -->
    <script src="js/core/debug_manager.js"></script>
    <script src="js/core/time_manager.js"></script>
    <script src="js/core/shader_manager.js"></script>
    <script src="js/core/geometry_manager.js"></script>
    <script src="js/core/procedural_generator.js"></script>
    <script src="js/core/texture_generator.js"></script>
    <script src="js/core/soil_manager.js"></script>
    <script src="js/core/plant_manager.js"></script>
    
    <!-- Procedural generation -->
    <script src="js/procedural/plant_generator.js"></script>
    
    <!-- Game systems -->
    <script src="js/systems/input_manager.js"></script>
    <script src="js/systems/camera_manager.js"></script>
    <script src="js/systems/render_system.js"></script>
    <script src="js/systems/overlay_manager.js"></script>
    <!-- Testing systems (loaded dynamically in tests) -->
    <!-- <script src="js/systems/screenshot_manager.js"></script> -->
    <!-- <script src="js/systems/log_reader.js"></script> -->
    
    <!-- Entities -->
    <script src="js/entities/character.js"></script>
    <script src="js/entities/soil.js"></script>
    <script src="js/entities/plant.js"></script>
    
    <!-- Main engine -->
    <script src="js/core/main_graphics.js"></script>
</body>
</html>
