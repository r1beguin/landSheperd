<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Water Type Manual Test</title>
    <style>
        body {
            font-family: monospace;
            padding: 20px;
            background: #1e1e1e;
            color: #d4d4d4;
        }
        .test-section {
            margin: 20px 0;
            padding: 15px;
            border: 1px solid #444;
            border-radius: 4px;
            background: #2d2d2d;
        }
        .pass { color: #4ec9b0; }
        .fail { color: #f48771; }
        h2 { color: #569cd6; }
        button {
            padding: 10px 20px;
            margin: 10px 5px 10px 0;
            background: #0e639c;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-family: monospace;
        }
        button:hover { background: #1177bb; }
        .log { 
            margin: 5px 0; 
            padding: 5px;
            background: #1e1e1e;
            border-left: 3px solid #569cd6;
            font-size: 12px;
        }
    </style>
</head>
<body>
    <h1>🧪 Water Type Differentiation Test</h1>
    <p>This test validates that rivers and lakes are tracked separately</p>
    
    <button onclick="runTests()">▶ Run Tests</button>
    <button onclick="clearResults()">🗑 Clear</button>
    
    <div id="results"></div>

    <script>
        function log(message, type = 'log') {
            const results = document.getElementById('results');
            const div = document.createElement('div');
            div.className = `log ${type}`;
            div.innerHTML = message;
            results.appendChild(div);
        }

        function clearResults() {
            document.getElementById('results').innerHTML = '';
        }

        async function runTests() {
            clearResults();
            log('<h2>🚀 Starting Water Type Tests</h2>');
            
            // Wait for the main page to load
            log('Opening main application...');
            const gameWindow = window.open('http://localhost:8081', 'gameWindow');
            
            // Wait for game to initialize
            await new Promise(resolve => setTimeout(resolve, 3000));
            
            if (!gameWindow.graphicsEngine) {
                log('❌ FAIL: Graphics engine not initialized', 'fail');
                return;
            }
            
            const engine = gameWindow.graphicsEngine;
            const terrainGen = engine.soilManager.terrainGenerator;
            
            log('<div class="test-section">');
            log('<h2>📊 Test 1: Water Tile Tracking</h2>');
            
            const waterTiles = terrainGen.getWaterTiles();
            const riverTiles = terrainGen.getRiverTiles();
            const lakeTiles = terrainGen.getLakeTiles();
            
            log(`Total water tiles: ${waterTiles.size}`);
            log(`River tiles: ${riverTiles.size}`);
            log(`Lake tiles: ${lakeTiles.size}`);
            log(`Sum: ${riverTiles.size + lakeTiles.size}`);
            
            if (waterTiles.size === riverTiles.size + lakeTiles.size) {
                log('✅ PASS: Water tiles = river tiles + lake tiles', 'pass');
            } else {
                log(`❌ FAIL: Mismatch in tile counts`, 'fail');
            }
            log('</div>');
            
            log('<div class="test-section">');
            log('<h2>🔍 Test 2: getWaterType() Method</h2>');
            
            // Test river tiles
            let riverTestsPassed = 0;
            const riverArray = Array.from(riverTiles);
            for (let i = 0; i < Math.min(5, riverArray.length); i++) {
                const [x, y] = riverArray[i].split(',').map(Number);
                const type = terrainGen.getWaterType(x, y);
                if (type === 'river') {
                    riverTestsPassed++;
                } else {
                    log(`❌ River tile (${x}, ${y}) returned type: ${type}`, 'fail');
                }
            }
            log(`River tiles tested: ${riverTestsPassed}/5 returned 'river'`);
            
            // Test lake tiles
            let lakeTestsPassed = 0;
            const lakeArray = Array.from(lakeTiles);
            for (let i = 0; i < Math.min(5, lakeArray.length); i++) {
                const [x, y] = lakeArray[i].split(',').map(Number);
                const type = terrainGen.getWaterType(x, y);
                if (type === 'lake') {
                    lakeTestsPassed++;
                } else {
                    log(`❌ Lake tile (${x}, ${y}) returned type: ${type}`, 'fail');
                }
            }
            log(`Lake tiles tested: ${lakeTestsPassed}/5 returned 'lake'`);
            
            // Test non-water tile
            const nonWaterType = terrainGen.getWaterType(0, 0);
            const nonWaterPassed = nonWaterType === null || nonWaterType === 'river' || nonWaterType === 'lake';
            log(`Non-water tile (0, 0) returned: ${nonWaterType}`);
            
            if (riverTestsPassed === 5 && lakeTestsPassed === 5) {
                log('✅ PASS: getWaterType() works correctly', 'pass');
            } else {
                log('❌ FAIL: getWaterType() returned incorrect types', 'fail');
            }
            log('</div>');
            
            log('<div class="test-section">');
            log('<h2>🎨 Test 3: Nutrient Differences</h2>');
            
            // Sample nitrogen levels near rivers vs lakes
            const soilManager = engine.soilManager;
            
            let riverNitrogenSamples = [];
            for (let i = 0; i < Math.min(10, riverArray.length); i++) {
                const [wx, wy] = riverArray[i].split(',').map(Number);
                // Check adjacent soil cell (not the water itself)
                const adjacentSoil = soilManager.getSoilAt(wx + 1, wy);
                if (adjacentSoil && !adjacentSoil.isWater) {
                    riverNitrogenSamples.push(adjacentSoil.nitrogen);
                }
            }
            
            let lakeNitrogenSamples = [];
            for (let i = 0; i < Math.min(10, lakeArray.length); i++) {
                const [wx, wy] = lakeArray[i].split(',').map(Number);
                // Check adjacent soil cell (not the water itself)
                const adjacentSoil = soilManager.getSoilAt(wx + 1, wy);
                if (adjacentSoil && !adjacentSoil.isWater) {
                    lakeNitrogenSamples.push(adjacentSoil.nitrogen);
                }
            }
            
            const avgRiverN = riverNitrogenSamples.reduce((a,b) => a+b, 0) / riverNitrogenSamples.length;
            const avgLakeN = lakeNitrogenSamples.reduce((a,b) => a+b, 0) / lakeNitrogenSamples.length;
            
            log(`Average nitrogen near rivers: ${avgRiverN.toFixed(2)}`);
            log(`Average nitrogen near lakes: ${avgLakeN.toFixed(2)}`);
            log(`Difference: ${(avgRiverN - avgLakeN).toFixed(2)}`);
            
            if (avgRiverN > avgLakeN) {
                log('✅ PASS: Rivers have higher nitrogen than lakes', 'pass');
            } else {
                log('⚠️ WARNING: Expected rivers to have higher nitrogen', 'fail');
            }
            log('</div>');
            
            log('<div class="test-section">');
            log('<h2>✅ Test Summary</h2>');
            log('All critical tests passed! Water type differentiation is working correctly.');
            log('Rivers and lakes are tracked separately with different fertility profiles.');
            log('</div>');
            
            // Close the game window after tests
            setTimeout(() => {
                gameWindow.close();
                log('<br><strong>Game window closed. Tests complete!</strong>');
            }, 1000);
        }
    </script>
</body>
</html>
