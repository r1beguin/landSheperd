<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Oak Mature Height Test</title>
    <style>
        body {
            margin: 0;
            padding: 20px;
            font-family: monospace;
            background: #1a1a1a;
            color: #fff;
        }
        #container {
            display: flex;
            gap: 40px;
            align-items: flex-end;
            justify-content: center;
            margin-top: 50px;
            padding: 20px;
            background: #2a2a2a;
            border-radius: 8px;
        }
        .tree-column {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
        }
        canvas {
            border: 1px solid #444;
            image-rendering: pixelated;
            image-rendering: crisp-edges;
        }
        .label {
            text-align: center;
            font-size: 14px;
            color: #aaa;
        }
        .dimensions {
            font-size: 12px;
            color: #888;
        }
        h1 {
            text-align: center;
            color: #4a7c3c;
        }
        .info {
            text-align: center;
            margin: 20px 0;
            padding: 15px;
            background: #2a2a2a;
            border-radius: 8px;
        }
        .success {
            color: #4a7c3c;
        }
    </style>
</head>
<body>
    <h1>Oak Mature Stage Height Test</h1>
    <div class="info">
        <div>Testing mature oak with 50% height increase and more visible trunk</div>
        <div class="dimensions">Base dimensions: 40×50 | Expected mature: ~40×75</div>
    </div>
    
    <div id="container">
        <div class="tree-column">
            <canvas id="sapling" width="200" height="200"></canvas>
            <div class="label">Sapling</div>
            <div class="dimensions" id="sapling-dims"></div>
        </div>
        
        <div class="tree-column">
            <canvas id="young" width="200" height="200"></canvas>
            <div class="label">Young Tree</div>
            <div class="dimensions" id="young-dims"></div>
        </div>
        
        <div class="tree-column">
            <canvas id="mature" width="200" height="200"></canvas>
            <div class="label">Mature Tree (50% taller)</div>
            <div class="dimensions" id="mature-dims"></div>
        </div>
    </div>
    
    <div id="results" style="margin-top: 30px; padding: 20px; background: #2a2a2a; border-radius: 8px;">
        <h2>Results:</h2>
        <div id="output"></div>
    </div>

    <!-- Load dependencies -->
    <script src="../../js/utils/color_utils.js"></script>
    <script src="../../js/utils/genetics_utils.js"></script>
    <script src="../../js/procedural/base_generator.js"></script>
    <script src="../../js/procedural/generators/tree_generator.js"></script>
    
    <script>
        // Load species config
        fetch('../../species/oak.json')
            .then(response => response.json())
            .then(speciesConfig => {
                console.log('Species config loaded:', speciesConfig);
                
                // Generate sprites for each stage
                const saplingSprite = TreeGenerator.generateSapling(speciesConfig, null);
                const youngSprite = TreeGenerator.generateYoungTree(speciesConfig, null);
                const matureSprite = TreeGenerator.generateMatureTree(speciesConfig, null);
                
                // Draw sprites on canvases (scaled up 4x for visibility)
                const scale = 4;
                
                // Sapling
                const saplingCanvas = document.getElementById('sapling');
                const saplingCtx = saplingCanvas.getContext('2d');
                saplingCtx.imageSmoothingEnabled = false;
                saplingCtx.clearRect(0, 0, 200, 200);
                saplingCtx.drawImage(
                    saplingSprite, 
                    100 - (saplingSprite.width * scale) / 2, 
                    200 - (saplingSprite.height * scale), 
                    saplingSprite.width * scale, 
                    saplingSprite.height * scale
                );
                document.getElementById('sapling-dims').textContent = 
                    `${saplingSprite.width}×${saplingSprite.height}px`;
                
                // Young tree
                const youngCanvas = document.getElementById('young');
                const youngCtx = youngCanvas.getContext('2d');
                youngCtx.imageSmoothingEnabled = false;
                youngCtx.clearRect(0, 0, 200, 200);
                youngCtx.drawImage(
                    youngSprite, 
                    100 - (youngSprite.width * scale) / 2, 
                    200 - (youngSprite.height * scale), 
                    youngSprite.width * scale, 
                    youngSprite.height * scale
                );
                document.getElementById('young-dims').textContent = 
                    `${youngSprite.width}×${youngSprite.height}px`;
                
                // Mature tree
                const matureCanvas = document.getElementById('mature');
                const matureCtx = matureCanvas.getContext('2d');
                matureCtx.imageSmoothingEnabled = false;
                matureCtx.clearRect(0, 0, 200, 200);
                matureCtx.drawImage(
                    matureSprite, 
                    100 - (matureSprite.width * scale) / 2, 
                    200 - (matureSprite.height * scale), 
                    matureSprite.width * scale, 
                    matureSprite.height * scale
                );
                document.getElementById('mature-dims').textContent = 
                    `${matureSprite.width}×${matureSprite.height}px`;
                
                // Calculate and display results
                const baseDimensions = speciesConfig.appearance.dimensions;
                const heightIncrease = ((matureSprite.height / baseDimensions.height) - 1) * 100;
                const matureVsYoung = ((matureSprite.height / youngSprite.height) - 1) * 100;
                
                const output = document.getElementById('output');
                output.innerHTML = `
                    <div><strong>Base dimensions:</strong> ${baseDimensions.width}×${baseDimensions.height}px</div>
                    <div><strong>Sapling sprite:</strong> ${saplingSprite.width}×${saplingSprite.height}px (~40% of base)</div>
                    <div><strong>Young tree sprite:</strong> ${youngSprite.width}×${youngSprite.height}px (~70% of base)</div>
                    <div class="success"><strong>Mature tree sprite:</strong> ${matureSprite.width}×${matureSprite.height}px</div>
                    <div class="success"><strong>Height increase from base:</strong> ${heightIncrease.toFixed(1)}% (target: 50%)</div>
                    <div class="success"><strong>Taller than young tree:</strong> ${matureVsYoung.toFixed(1)}%</div>
                    <div style="margin-top: 10px;"><strong>✓ Trunk visibility:</strong> Trunk height is now 55% of total height (up from 40%)</div>
                    <div><strong>✓ Expected result:</strong> Mature tree should show significantly more trunk below canopy</div>
                `;
                
                console.log('Heights:', {
                    sapling: saplingSprite.height,
                    young: youngSprite.height,
                    mature: matureSprite.height,
                    heightIncreasePercent: heightIncrease,
                    matureVsYoungPercent: matureVsYoung
                });
            })
            .catch(error => {
                console.error('Error loading species config:', error);
                document.getElementById('output').innerHTML = 
                    `<div style="color: #ff4444;">Error: ${error.message}</div>`;
            });
    </script>
</body>
</html>
