<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nutrient System Test - Land Shepherd</title>
    <style>
        body {
            margin: 0;
            padding: 20px;
            font-family: 'Courier New', monospace;
            background: #1a1a1a;
            color: #00ff00;
        }
        #testContainer {
            max-width: 1200px;
            margin: 0 auto;
        }
        h1 {
            color: #00ff00;
            text-align: center;
            margin-bottom: 30px;
        }
        .test-section {
            background: #0a0a0a;
            border: 2px solid #00ff00;
            padding: 15px;
            margin-bottom: 20px;
            border-radius: 5px;
        }
        .test-title {
            font-size: 18px;
            font-weight: bold;
            color: #ffff00;
            margin-bottom: 10px;
        }
        .test-status {
            padding: 5px 10px;
            margin-left: 10px;
            border-radius: 3px;
            font-weight: bold;
        }
        .status-running {
            background: #ff8800;
            color: #000;
        }
        .status-pass {
            background: #00ff00;
            color: #000;
        }
        .status-fail {
            background: #ff0000;
            color: #fff;
        }
        .test-details {
            margin-top: 10px;
            padding-left: 20px;
            line-height: 1.6;
        }
        .test-result {
            margin: 5px 0;
        }
        .pass {
            color: #00ff00;
        }
        .fail {
            color: #ff0000;
        }
        .info {
            color: #00aaff;
        }
        #summary {
            background: #0a0a0a;
            border: 3px solid #ffff00;
            padding: 20px;
            margin-top: 30px;
            text-align: center;
            font-size: 20px;
        }
        .summary-pass {
            border-color: #00ff00;
            color: #00ff00;
        }
        .summary-fail {
            border-color: #ff0000;
            color: #ff0000;
        }
    </style>
</head>
<body>
    <div id="testContainer">
        <h1>NUTRIENT-SPECIFIC SYSTEM TEST</h1>
        <div id="testResults"></div>
        <div id="summary"></div>
    </div>

    <script>
        // Test framework
        class NutrientTestSuite {
            constructor() {
                this.tests = [];
                this.results = [];
                this.speciesConfig = null;
            }

            async loadSpeciesConfig() {
                try {
                    const response = await fetch('./species/nettles.json');
                    this.speciesConfig = await response.json();
                    return true;
                } catch (error) {
                    console.error('Failed to load species config:', error);
                    return false;
                }
            }

            addTest(name, description, testFn) {
                this.tests.push({ name, description, testFn });
            }

            async runTests() {
                const resultsDiv = document.getElementById('testResults');
                let passCount = 0;
                let failCount = 0;

                for (const test of this.tests) {
                    const testSection = document.createElement('div');
                    testSection.className = 'test-section';
                    testSection.innerHTML = `
                        <div class="test-title">
                            ${test.name}
                            <span class="test-status status-running">RUNNING</span>
                        </div>
                        <div class="test-details">
                            <div class="info">${test.description}</div>
                            <div class="test-result-container"></div>
                        </div>
                    `;
                    resultsDiv.appendChild(testSection);

                    try {
                        const result = await test.testFn(this.speciesConfig);
                        const statusSpan = testSection.querySelector('.test-status');
                        const resultContainer = testSection.querySelector('.test-result-container');

                        if (result.pass) {
                            statusSpan.className = 'test-status status-pass';
                            statusSpan.textContent = 'PASS';
                            passCount++;
                        } else {
                            statusSpan.className = 'test-status status-fail';
                            statusSpan.textContent = 'FAIL';
                            failCount++;
                        }

                        result.messages.forEach(msg => {
                            const msgDiv = document.createElement('div');
                            msgDiv.className = `test-result ${msg.type}`;
                            msgDiv.textContent = msg.text;
                            resultContainer.appendChild(msgDiv);
                        });

                        this.results.push({ name: test.name, ...result });
                    } catch (error) {
                        const statusSpan = testSection.querySelector('.test-status');
                        statusSpan.className = 'test-status status-fail';
                        statusSpan.textContent = 'ERROR';
                        failCount++;

                        const resultContainer = testSection.querySelector('.test-result-container');
                        const errorDiv = document.createElement('div');
                        errorDiv.className = 'test-result fail';
                        errorDiv.textContent = `ERROR: ${error.message}`;
                        resultContainer.appendChild(errorDiv);
                    }
                }

                this.displaySummary(passCount, failCount);
            }

            displaySummary(passCount, failCount) {
                const summaryDiv = document.getElementById('summary');
                const total = passCount + failCount;
                const allPassed = failCount === 0;

                summaryDiv.className = allPassed ? 'summary-pass' : 'summary-fail';
                summaryDiv.innerHTML = `
                    <div>TEST SUMMARY</div>
                    <div style="margin-top: 10px;">
                        Total: ${total} | 
                        <span class="pass">Passed: ${passCount}</span> | 
                        <span class="fail">Failed: ${failCount}</span>
                    </div>
                    <div style="margin-top: 15px; font-size: 24px;">
                        ${allPassed ? '✓ ALL TESTS PASSED' : '✗ SOME TESTS FAILED'}
                    </div>
                `;
            }
        }

        // Mock classes for isolated testing
        class MockSoil {
            constructor(nitrogen, phosphorus, potassium, organicMatter) {
                this.nitrogen = nitrogen;
                this.phosphorus = phosphorus;
                this.potassium = potassium;
                this.organicMatter = organicMatter;
                this.fertility = (nitrogen + phosphorus + potassium + organicMatter) / 4;
                this.isPlantable = true;
            }
        }

        // Test suite setup
        const suite = new NutrientTestSuite();

        // Test 1: Config Structure Validation
        suite.addTest(
            'Test 1: Species Config Structure',
            'Verify nettles.json has nutrientRequirements with correct structure',
            async (config) => {
                const messages = [];
                let pass = true;

                // Check environment exists
                if (!config.environment) {
                    messages.push({ type: 'fail', text: '✗ Missing environment section' });
                    pass = false;
                    return { pass, messages };
                }

                // Check nutrientRequirements exists
                if (!config.environment.nutrientRequirements) {
                    messages.push({ type: 'fail', text: '✗ Missing nutrientRequirements section' });
                    pass = false;
                    return { pass, messages };
                }

                const reqs = config.environment.nutrientRequirements;

                // Check each nutrient
                const nutrients = ['nitrogen', 'phosphorus', 'potassium', 'organicMatter'];
                for (const nutrient of nutrients) {
                    if (!reqs[nutrient]) {
                        messages.push({ type: 'fail', text: `✗ Missing ${nutrient} requirements` });
                        pass = false;
                    } else {
                        if (typeof reqs[nutrient].minimum !== 'number') {
                            messages.push({ type: 'fail', text: `✗ ${nutrient}.minimum is not a number` });
                            pass = false;
                        } else {
                            messages.push({ type: 'pass', text: `✓ ${nutrient}.minimum = ${reqs[nutrient].minimum}` });
                        }

                        if (typeof reqs[nutrient].optimal !== 'number') {
                            messages.push({ type: 'fail', text: `✗ ${nutrient}.optimal is not a number` });
                            pass = false;
                        } else {
                            messages.push({ type: 'pass', text: `✓ ${nutrient}.optimal = ${reqs[nutrient].optimal}` });
                        }
                    }
                }

                return { pass, messages };
            }
        );

        // Test 2: Nutrient Minimum Values
        suite.addTest(
            'Test 2: Nutrient Minimum Thresholds',
            'Verify minimum values are balanced relative to consumption rates',
            async (config) => {
                const messages = [];
                let pass = true;

                const reqs = config.environment.nutrientRequirements;
                
                // Calculate total consumption across lifecycle
                const totalConsumption = {
                    nitrogen: 0,
                    phosphorus: 0,
                    potassium: 0,
                    organicMatter: 0
                };

                config.growthStages.forEach(stage => {
                    if (stage.nutrientConsumption) {
                        totalConsumption.nitrogen += stage.nutrientConsumption.nitrogen || 0;
                        totalConsumption.phosphorus += stage.nutrientConsumption.phosphorus || 0;
                        totalConsumption.potassium += stage.nutrientConsumption.potassium || 0;
                        totalConsumption.organicMatter += stage.nutrientConsumption.organicMatter || 0;
                    }
                });

                messages.push({ type: 'info', text: `Total N consumption: ${totalConsumption.nitrogen}` });
                messages.push({ type: 'info', text: `Total P consumption: ${totalConsumption.phosphorus}` });
                messages.push({ type: 'info', text: `Total K consumption: ${totalConsumption.potassium}` });
                messages.push({ type: 'info', text: `Total OM consumption: ${totalConsumption.organicMatter}` });

                // Check if minimums allow at least one growth stage
                const nutrients = ['nitrogen', 'phosphorus', 'potassium', 'organicMatter'];
                nutrients.forEach(nutrient => {
                    const min = reqs[nutrient].minimum;
                    const consumption = totalConsumption[nutrient];
                    const ratio = consumption / min;

                    messages.push({ type: 'info', text: `${nutrient}: min=${min}, consumption=${consumption}, ratio=${ratio.toFixed(2)}x` });

                    if (min < consumption * 0.3) {
                        messages.push({ type: 'fail', text: `✗ ${nutrient} minimum too low (less than 30% of total consumption)` });
                        pass = false;
                    } else if (min > consumption * 0.8) {
                        messages.push({ type: 'fail', text: `✗ ${nutrient} minimum too high (more than 80% of total consumption)` });
                        pass = false;
                    } else {
                        messages.push({ type: 'pass', text: `✓ ${nutrient} minimum is balanced` });
                    }
                });

                return { pass, messages };
            }
        );

        // Test 3: Sufficient Nutrients Allow Growth
        suite.addTest(
            'Test 3: Sufficient Nutrients Pass All Checks',
            'Soil with nutrients above minimums should allow growth and reproduction',
            async (config) => {
                const messages = [];
                let pass = true;

                const reqs = config.environment.nutrientRequirements;
                
                // Create soil with all nutrients at minimum + 5
                const soil = new MockSoil(
                    reqs.nitrogen.minimum + 5,
                    reqs.phosphorus.minimum + 5,
                    reqs.potassium.minimum + 5,
                    reqs.organicMatter.minimum + 5
                );

                messages.push({ type: 'info', text: `Test soil: N=${soil.nitrogen}, P=${soil.phosphorus}, K=${soil.potassium}, OM=${soil.organicMatter}` });
                messages.push({ type: 'info', text: `Fertility: ${soil.fertility.toFixed(1)}` });

                // Simulate nutrient checks
                const insufficientNutrients = [];
                if (soil.nitrogen < reqs.nitrogen.minimum) insufficientNutrients.push('N');
                if (soil.phosphorus < reqs.phosphorus.minimum) insufficientNutrients.push('P');
                if (soil.potassium < reqs.potassium.minimum) insufficientNutrients.push('K');
                if (soil.organicMatter < reqs.organicMatter.minimum) insufficientNutrients.push('OM');

                if (insufficientNutrients.length > 0) {
                    messages.push({ type: 'fail', text: `✗ Insufficient nutrients detected: ${insufficientNutrients.join(', ')}` });
                    pass = false;
                } else {
                    messages.push({ type: 'pass', text: '✓ All nutrients sufficient for growth' });
                }

                // Check reproduction logic
                const reproductionAllowed = 
                    soil.nitrogen >= reqs.nitrogen.minimum &&
                    soil.phosphorus >= reqs.phosphorus.minimum &&
                    soil.potassium >= reqs.potassium.minimum &&
                    soil.organicMatter >= reqs.organicMatter.minimum;

                if (!reproductionAllowed) {
                    messages.push({ type: 'fail', text: '✗ Reproduction check failed' });
                    pass = false;
                } else {
                    messages.push({ type: 'pass', text: '✓ Reproduction allowed' });
                }

                return { pass, messages };
            }
        );

        // Test 4: Nitrogen Deficiency Blocks Growth
        suite.addTest(
            'Test 4: Nitrogen Deficiency Detection',
            'Low nitrogen should block growth even with high other nutrients',
            async (config) => {
                const messages = [];
                let pass = true;

                const reqs = config.environment.nutrientRequirements;
                
                // Create soil with ONLY nitrogen deficient, others optimal
                const soil = new MockSoil(
                    reqs.nitrogen.minimum - 3,  // Below minimum
                    reqs.phosphorus.optimal,     // Optimal
                    reqs.potassium.optimal,      // Optimal
                    reqs.organicMatter.optimal   // Optimal
                );

                messages.push({ type: 'info', text: `Test soil: N=${soil.nitrogen}, P=${soil.phosphorus}, K=${soil.potassium}, OM=${soil.organicMatter}` });
                messages.push({ type: 'info', text: `Fertility: ${soil.fertility.toFixed(1)} (should be HIGH despite N deficiency)` });

                // Simulate nutrient checks
                const insufficientNutrients = [];
                if (soil.nitrogen < reqs.nitrogen.minimum) insufficientNutrients.push('N');
                if (soil.phosphorus < reqs.phosphorus.minimum) insufficientNutrients.push('P');
                if (soil.potassium < reqs.potassium.minimum) insufficientNutrients.push('K');
                if (soil.organicMatter < reqs.organicMatter.minimum) insufficientNutrients.push('OM');

                if (insufficientNutrients.length === 0) {
                    messages.push({ type: 'fail', text: '✗ Nitrogen deficiency not detected!' });
                    pass = false;
                } else if (insufficientNutrients.includes('N') && insufficientNutrients.length === 1) {
                    messages.push({ type: 'pass', text: '✓ Nitrogen deficiency correctly detected' });
                    messages.push({ type: 'pass', text: `✓ Only N flagged (not P, K, or OM)` });
                } else {
                    messages.push({ type: 'fail', text: `✗ Wrong nutrients flagged: ${insufficientNutrients.join(', ')}` });
                    pass = false;
                }

                return { pass, messages };
            }
        );

        // Test 5: Multiple Deficiencies Detected
        suite.addTest(
            'Test 5: Multiple Nutrient Deficiencies',
            'System should detect multiple simultaneous deficiencies',
            async (config) => {
                const messages = [];
                let pass = true;

                const reqs = config.environment.nutrientRequirements;
                
                // Create soil with N and P deficient, K and OM sufficient
                const soil = new MockSoil(
                    reqs.nitrogen.minimum - 2,      // Below minimum
                    reqs.phosphorus.minimum - 1,    // Below minimum
                    reqs.potassium.minimum + 5,     // Above minimum
                    reqs.organicMatter.minimum + 5  // Above minimum
                );

                messages.push({ type: 'info', text: `Test soil: N=${soil.nitrogen}, P=${soil.phosphorus}, K=${soil.potassium}, OM=${soil.organicMatter}` });

                // Simulate nutrient checks
                const insufficientNutrients = [];
                if (soil.nitrogen < reqs.nitrogen.minimum) insufficientNutrients.push('N');
                if (soil.phosphorus < reqs.phosphorus.minimum) insufficientNutrients.push('P');
                if (soil.potassium < reqs.potassium.minimum) insufficientNutrients.push('K');
                if (soil.organicMatter < reqs.organicMatter.minimum) insufficientNutrients.push('OM');

                messages.push({ type: 'info', text: `Detected deficiencies: ${insufficientNutrients.join(', ') || 'none'}` });

                if (insufficientNutrients.length !== 2) {
                    messages.push({ type: 'fail', text: `✗ Expected 2 deficiencies, got ${insufficientNutrients.length}` });
                    pass = false;
                } else if (!insufficientNutrients.includes('N') || !insufficientNutrients.includes('P')) {
                    messages.push({ type: 'fail', text: '✗ Wrong nutrients flagged' });
                    pass = false;
                } else {
                    messages.push({ type: 'pass', text: '✓ Both N and P deficiencies detected' });
                }

                return { pass, messages };
            }
        );

        // Test 6: Edge Case - Exactly at Minimum
        suite.addTest(
            'Test 6: Boundary Condition (Exactly at Minimum)',
            'Nutrients exactly at minimum should allow growth',
            async (config) => {
                const messages = [];
                let pass = true;

                const reqs = config.environment.nutrientRequirements;
                
                // Create soil with all nutrients exactly at minimum
                const soil = new MockSoil(
                    reqs.nitrogen.minimum,
                    reqs.phosphorus.minimum,
                    reqs.potassium.minimum,
                    reqs.organicMatter.minimum
                );

                messages.push({ type: 'info', text: `Test soil: N=${soil.nitrogen}, P=${soil.phosphorus}, K=${soil.potassium}, OM=${soil.organicMatter}` });

                // Simulate nutrient checks
                const insufficientNutrients = [];
                if (soil.nitrogen < reqs.nitrogen.minimum) insufficientNutrients.push('N');
                if (soil.phosphorus < reqs.phosphorus.minimum) insufficientNutrients.push('P');
                if (soil.potassium < reqs.potassium.minimum) insufficientNutrients.push('K');
                if (soil.organicMatter < reqs.organicMatter.minimum) insufficientNutrients.push('OM');

                if (insufficientNutrients.length > 0) {
                    messages.push({ type: 'fail', text: `✗ Nutrients at minimum incorrectly flagged as insufficient: ${insufficientNutrients.join(', ')}` });
                    pass = false;
                } else {
                    messages.push({ type: 'pass', text: '✓ All nutrients at minimum correctly pass checks' });
                }

                return { pass, messages };
            }
        );

        // Test 7: Nitrogen-Loving Characteristic
        suite.addTest(
            'Test 7: Nitrogen-Loving Species Trait',
            'Verify nitrogen requirement reflects higher consumption rate',
            async (config) => {
                const messages = [];
                let pass = true;

                const reqs = config.environment.nutrientRequirements;
                
                // Calculate consumption rates
                const totalConsumption = { nitrogen: 0, phosphorus: 0, potassium: 0, organicMatter: 0 };
                config.growthStages.forEach(stage => {
                    if (stage.nutrientConsumption) {
                        totalConsumption.nitrogen += stage.nutrientConsumption.nitrogen || 0;
                        totalConsumption.phosphorus += stage.nutrientConsumption.phosphorus || 0;
                        totalConsumption.potassium += stage.nutrientConsumption.potassium || 0;
                        totalConsumption.organicMatter += stage.nutrientConsumption.organicMatter || 0;
                    }
                });

                // Check if N consumption is highest
                const maxConsumption = Math.max(
                    totalConsumption.nitrogen,
                    totalConsumption.phosphorus,
                    totalConsumption.potassium,
                    totalConsumption.organicMatter
                );

                if (totalConsumption.nitrogen !== maxConsumption) {
                    messages.push({ type: 'fail', text: '✗ Nitrogen is not the most consumed nutrient' });
                    pass = false;
                } else {
                    messages.push({ type: 'pass', text: '✓ Nitrogen is the most consumed nutrient (nitrogen-loving trait)' });
                }

                // Check if N minimum reflects this (should be higher than P and K)
                if (reqs.nitrogen.minimum <= reqs.phosphorus.minimum || reqs.nitrogen.minimum <= reqs.potassium.minimum) {
                    messages.push({ type: 'fail', text: '✗ Nitrogen minimum should be higher than P and K' });
                    pass = false;
                } else {
                    messages.push({ type: 'pass', text: '✓ Nitrogen minimum (${reqs.nitrogen.minimum}) > P (${reqs.phosphorus.minimum}) and K (${reqs.potassium.minimum})' });
                }

                return { pass, messages };
            }
        );

        // Test 8: Growth Modifiers Configuration
        suite.addTest(
            'Test 8: Growth Modifiers Configuration (Phase 2)',
            'Verify Vegetative and Flowering stages have growth modifiers',
            async (config) => {
                const messages = [];
                let pass = true;

                const vegetative = config.growthStages.find(s => s.name === 'Vegetative');
                const flowering = config.growthStages.find(s => s.name === 'Flowering');

                if (!vegetative || !vegetative.growthModifiers) {
                    messages.push({ type: 'fail', text: '✗ Vegetative stage missing growthModifiers' });
                    pass = false;
                } else {
                    messages.push({ type: 'pass', text: '✓ Vegetative stage has growthModifiers' });
                    
                    // Check weights sum to 1.0
                    const weights = vegetative.growthModifiers;
                    const sum = weights.nitrogen.weight + weights.phosphorus.weight + 
                                weights.potassium.weight + weights.organicMatter.weight;
                    
                    if (Math.abs(sum - 1.0) > 0.01) {
                        messages.push({ type: 'fail', text: `✗ Vegetative weights sum to ${sum.toFixed(2)}, should be 1.0` });
                        pass = false;
                    } else {
                        messages.push({ type: 'pass', text: `✓ Vegetative weights sum to ${sum.toFixed(2)}` });
                    }
                    
                    messages.push({ type: 'info', text: `  N=${weights.nitrogen.weight}, P=${weights.phosphorus.weight}, K=${weights.potassium.weight}, OM=${weights.organicMatter.weight}` });
                }

                if (!flowering || !flowering.growthModifiers) {
                    messages.push({ type: 'fail', text: '✗ Flowering stage missing growthModifiers' });
                    pass = false;
                } else {
                    messages.push({ type: 'pass', text: '✓ Flowering stage has growthModifiers' });
                    
                    const weights = flowering.growthModifiers;
                    const sum = weights.nitrogen.weight + weights.phosphorus.weight + 
                                weights.potassium.weight + weights.organicMatter.weight;
                    
                    if (Math.abs(sum - 1.0) > 0.01) {
                        messages.push({ type: 'fail', text: `✗ Flowering weights sum to ${sum.toFixed(2)}, should be 1.0` });
                        pass = false;
                    } else {
                        messages.push({ type: 'pass', text: `✓ Flowering weights sum to ${sum.toFixed(2)}` });
                    }
                    
                    messages.push({ type: 'info', text: `  N=${weights.nitrogen.weight}, P=${weights.phosphorus.weight}, K=${weights.potassium.weight}, OM=${weights.organicMatter.weight}` });
                }

                return { pass, messages };
            }
        );

        // Test 9: Growth Rate Calculation Logic
        suite.addTest(
            'Test 9: Growth Rate Calculation (Phase 2)',
            'Verify growth rate varies with nutrient quality',
            async (config) => {
                const messages = [];
                let pass = true;

                const reqs = config.environment.nutrientRequirements;
                const vegetative = config.growthStages.find(s => s.name === 'Vegetative');
                
                if (!vegetative || !vegetative.growthModifiers) {
                    messages.push({ type: 'fail', text: '✗ Cannot test without growth modifiers' });
                    return { pass: false, messages };
                }

                // Helper function to calculate nutrient score
                function nutrientScore(value, requirement) {
                    if (value < requirement.minimum) return 0.0;
                    if (value >= requirement.optimal) return 1.0;
                    const range = requirement.optimal - requirement.minimum;
                    return (value - requirement.minimum) / range;
                }

                // Helper to calculate growth rate
                function calculateGrowthRate(soil, modifiers) {
                    let totalScore = 0;
                    totalScore += nutrientScore(soil.nitrogen, reqs.nitrogen) * modifiers.nitrogen.weight;
                    totalScore += nutrientScore(soil.phosphorus, reqs.phosphorus) * modifiers.phosphorus.weight;
                    totalScore += nutrientScore(soil.potassium, reqs.potassium) * modifiers.potassium.weight;
                    totalScore += nutrientScore(soil.organicMatter, reqs.organicMatter) * modifiers.organicMatter.weight;
                    return totalScore;
                }

                // Test 1: Optimal soil should give 1.0x growth rate
                const optimalSoil = new MockSoil(
                    reqs.nitrogen.optimal,
                    reqs.phosphorus.optimal,
                    reqs.potassium.optimal,
                    reqs.organicMatter.optimal
                );
                const optimalRate = calculateGrowthRate(optimalSoil, vegetative.growthModifiers);
                
                if (Math.abs(optimalRate - 1.0) > 0.01) {
                    messages.push({ type: 'fail', text: `✗ Optimal soil rate ${optimalRate.toFixed(2)}, expected 1.0` });
                    pass = false;
                } else {
                    messages.push({ type: 'pass', text: `✓ Optimal soil gives 1.0x growth rate` });
                }

                // Test 2: Minimum soil should give ~0.0x growth rate
                const minimumSoil = new MockSoil(
                    reqs.nitrogen.minimum,
                    reqs.phosphorus.minimum,
                    reqs.potassium.minimum,
                    reqs.organicMatter.minimum
                );
                const minimumRate = calculateGrowthRate(minimumSoil, vegetative.growthModifiers);
                
                if (minimumRate > 0.1) {
                    messages.push({ type: 'fail', text: `✗ Minimum soil rate ${minimumRate.toFixed(2)}, expected ~0.0` });
                    pass = false;
                } else {
                    messages.push({ type: 'pass', text: `✓ Minimum soil gives ${minimumRate.toFixed(2)}x growth rate` });
                }

                // Test 3: Marginal soil (halfway) should give ~0.5x growth rate
                const marginalSoil = new MockSoil(
                    (reqs.nitrogen.minimum + reqs.nitrogen.optimal) / 2,
                    (reqs.phosphorus.minimum + reqs.phosphorus.optimal) / 2,
                    (reqs.potassium.minimum + reqs.potassium.optimal) / 2,
                    (reqs.organicMatter.minimum + reqs.organicMatter.optimal) / 2
                );
                const marginalRate = calculateGrowthRate(marginalSoil, vegetative.growthModifiers);
                
                if (Math.abs(marginalRate - 0.5) > 0.1) {
                    messages.push({ type: 'fail', text: `✗ Marginal soil rate ${marginalRate.toFixed(2)}, expected ~0.5` });
                    pass = false;
                } else {
                    messages.push({ type: 'pass', text: `✓ Marginal soil gives ${marginalRate.toFixed(2)}x growth rate` });
                }

                // Test 4: Nitrogen bottleneck (N low, others high)
                const nitrogenBottleneck = new MockSoil(
                    reqs.nitrogen.minimum + 3,  // Just above minimum
                    reqs.phosphorus.optimal,
                    reqs.potassium.optimal,
                    reqs.organicMatter.optimal
                );
                const bottleneckRate = calculateGrowthRate(nitrogenBottleneck, vegetative.growthModifiers);
                
                messages.push({ type: 'info', text: `Nitrogen bottleneck scenario: ${bottleneckRate.toFixed(2)}x growth rate` });
                
                if (bottleneckRate > 0.5) {
                    messages.push({ type: 'fail', text: `✗ Bottleneck rate too high (${bottleneckRate.toFixed(2)}), N should limit growth` });
                    pass = false;
                } else {
                    messages.push({ type: 'pass', text: `✓ Nitrogen bottleneck correctly limits growth to ${bottleneckRate.toFixed(2)}x` });
                }

                return { pass, messages };
            }
        );

        // Test 10: Visual Feedback - Tint Calculation Logic
        suite.addTest(
            'Test 10: Nutrient Tint Calculation (Phase 3)',
            'Verify tint colors reflect nutrient deficiencies correctly',
            async (config) => {
                const messages = [];
                let pass = true;

                const reqs = config.environment.nutrientRequirements;

                // Helper function to calculate nutrient score
                function nutrientScore(value, requirement) {
                    if (value < requirement.minimum) return 0.0;
                    if (value >= requirement.optimal) return 1.0;
                    const range = requirement.optimal - requirement.minimum;
                    return (value - requirement.minimum) / range;
                }

                // Helper to calculate tint (replicated from plant.js)
                function calculateNutrientTint(soil) {
                    const nScore = nutrientScore(soil.nitrogen, reqs.nitrogen);
                    const pScore = nutrientScore(soil.phosphorus, reqs.phosphorus);
                    const kScore = nutrientScore(soil.potassium, reqs.potassium);
                    const omScore = nutrientScore(soil.organicMatter, reqs.organicMatter);
                    
                    const minScore = Math.min(nScore, pScore, kScore, omScore);
                    
                    let limitingNutrient = 'none';
                    if (minScore < 1.0) {
                        if (nScore === minScore) limitingNutrient = 'nitrogen';
                        else if (pScore === minScore) limitingNutrient = 'phosphorus';
                        else if (kScore === minScore) limitingNutrient = 'potassium';
                        else if (omScore === minScore) limitingNutrient = 'organicMatter';
                    }
                    
                    let r = 1.0, g = 1.0, b = 1.0;
                    const deficiency = 1.0 - minScore;
                    
                    switch (limitingNutrient) {
                        case 'nitrogen':
                            r = 1.0;
                            g = 1.0 - (deficiency * 0.3);
                            b = 1.0 - (deficiency * 0.4);
                            break;
                        case 'phosphorus':
                            r = 1.0;
                            g = 1.0 - (deficiency * 0.4);
                            b = 1.0 - (deficiency * 0.1);
                            break;
                        case 'potassium':
                            r = 1.0;
                            g = 1.0 - (deficiency * 0.35);
                            b = 1.0 - (deficiency * 0.5);
                            break;
                        case 'organicMatter':
                            const desaturation = 1.0 - (deficiency * 0.25);
                            r = desaturation;
                            g = desaturation;
                            b = desaturation;
                            break;
                        default:
                            r = 1.0;
                            g = 1.0;
                            b = 1.0;
                            break;
                    }
                    
                    return { r, g, b, limitingNutrient, deficiency };
                }

                // Test 1: Optimal soil should give white tint (1,1,1)
                const optimalSoil = new MockSoil(
                    reqs.nitrogen.optimal,
                    reqs.phosphorus.optimal,
                    reqs.potassium.optimal,
                    reqs.organicMatter.optimal
                );
                const optimalTint = calculateNutrientTint(optimalSoil);
                
                if (Math.abs(optimalTint.r - 1.0) > 0.01 || Math.abs(optimalTint.g - 1.0) > 0.01 || Math.abs(optimalTint.b - 1.0) > 0.01) {
                    messages.push({ type: 'fail', text: `✗ Optimal soil tint (${optimalTint.r.toFixed(2)}, ${optimalTint.g.toFixed(2)}, ${optimalTint.b.toFixed(2)}), expected (1.0, 1.0, 1.0)` });
                    pass = false;
                } else {
                    messages.push({ type: 'pass', text: `✓ Optimal soil gives white tint (1.0, 1.0, 1.0)` });
                }

                // Test 2: Nitrogen deficiency should give yellow/pale tint
                const nitrogenDeficientSoil = new MockSoil(
                    reqs.nitrogen.minimum,
                    reqs.phosphorus.optimal,
                    reqs.potassium.optimal,
                    reqs.organicMatter.optimal
                );
                const nTint = calculateNutrientTint(nitrogenDeficientSoil);
                
                if (nTint.limitingNutrient !== 'nitrogen') {
                    messages.push({ type: 'fail', text: `✗ Nitrogen deficiency not detected as limiting nutrient` });
                    pass = false;
                } else {
                    messages.push({ type: 'pass', text: `✓ Nitrogen detected as limiting nutrient` });
                    messages.push({ type: 'info', text: `  Tint: R=${nTint.r.toFixed(2)}, G=${nTint.g.toFixed(2)}, B=${nTint.b.toFixed(2)} (yellow/pale)` });
                    
                    // Should have reduced green and blue (yellow tint)
                    if (nTint.g >= 1.0 || nTint.b >= 1.0) {
                        messages.push({ type: 'fail', text: `✗ Nitrogen deficiency should reduce green/blue channels` });
                        pass = false;
                    } else {
                        messages.push({ type: 'pass', text: `✓ Green and blue reduced for yellow/pale effect` });
                    }
                }

                // Test 3: Phosphorus deficiency should give purple tint
                const phosphorusDeficientSoil = new MockSoil(
                    reqs.nitrogen.optimal,
                    reqs.phosphorus.minimum,
                    reqs.potassium.optimal,
                    reqs.organicMatter.optimal
                );
                const pTint = calculateNutrientTint(phosphorusDeficientSoil);
                
                if (pTint.limitingNutrient !== 'phosphorus') {
                    messages.push({ type: 'fail', text: `✗ Phosphorus deficiency not detected as limiting nutrient` });
                    pass = false;
                } else {
                    messages.push({ type: 'pass', text: `✓ Phosphorus detected as limiting nutrient` });
                    messages.push({ type: 'info', text: `  Tint: R=${pTint.r.toFixed(2)}, G=${pTint.g.toFixed(2)}, B=${pTint.b.toFixed(2)} (purple)` });
                    
                    // Should have reduced green (purple = red + blue, less green)
                    if (pTint.g >= 1.0) {
                        messages.push({ type: 'fail', text: `✗ Phosphorus deficiency should reduce green channel` });
                        pass = false;
                    } else {
                        messages.push({ type: 'pass', text: `✓ Green reduced for purple effect` });
                    }
                }

                // Test 4: Potassium deficiency should give brown tint
                const potassiumDeficientSoil = new MockSoil(
                    reqs.nitrogen.optimal,
                    reqs.phosphorus.optimal,
                    reqs.potassium.minimum,
                    reqs.organicMatter.optimal
                );
                const kTint = calculateNutrientTint(potassiumDeficientSoil);
                
                if (kTint.limitingNutrient !== 'potassium') {
                    messages.push({ type: 'fail', text: `✗ Potassium deficiency not detected as limiting nutrient` });
                    pass = false;
                } else {
                    messages.push({ type: 'pass', text: `✓ Potassium detected as limiting nutrient` });
                    messages.push({ type: 'info', text: `  Tint: R=${kTint.r.toFixed(2)}, G=${kTint.g.toFixed(2)}, B=${kTint.b.toFixed(2)} (brown)` });
                    
                    // Should have reduced green and blue (brown tint)
                    if (kTint.g >= 1.0 || kTint.b >= 1.0) {
                        messages.push({ type: 'fail', text: `✗ Potassium deficiency should reduce green/blue channels` });
                        pass = false;
                    } else {
                        messages.push({ type: 'pass', text: `✓ Green and blue reduced for brown effect` });
                    }
                }

                // Test 5: Organic matter deficiency should give dull/desaturated tint
                const omDeficientSoil = new MockSoil(
                    reqs.nitrogen.optimal,
                    reqs.phosphorus.optimal,
                    reqs.potassium.optimal,
                    reqs.organicMatter.minimum
                );
                const omTint = calculateNutrientTint(omDeficientSoil);
                
                if (omTint.limitingNutrient !== 'organicMatter') {
                    messages.push({ type: 'fail', text: `✗ Organic matter deficiency not detected as limiting nutrient` });
                    pass = false;
                } else {
                    messages.push({ type: 'pass', text: `✓ Organic matter detected as limiting nutrient` });
                    messages.push({ type: 'info', text: `  Tint: R=${omTint.r.toFixed(2)}, G=${omTint.g.toFixed(2)}, B=${omTint.b.toFixed(2)} (dull)` });
                    
                    // All channels should be equally reduced (desaturation)
                    if (omTint.r !== omTint.g || omTint.g !== omTint.b) {
                        messages.push({ type: 'fail', text: `✗ Organic matter deficiency should equally reduce all channels` });
                        pass = false;
                    } else {
                        messages.push({ type: 'pass', text: `✓ All channels equally reduced for dull effect` });
                    }
                }

                return { pass, messages };
            }
        );

        // Test 11: Visual Feedback Integration
        suite.addTest(
            'Test 11: Shader Tint Integration (Phase 3)',
            'Verify shader supports u_tint uniform for color multiplication',
            async (config) => {
                const messages = [];
                let pass = true;

                // This test verifies the conceptual integration
                // Actual shader testing requires WebGL context
                
                messages.push({ type: 'info', text: 'Verifying shader integration requirements...' });
                
                // Check that tint is a 4-component RGBA value
                const testTint = [0.9, 0.7, 0.6, 1.0];
                
                if (testTint.length !== 4) {
                    messages.push({ type: 'fail', text: '✗ Tint must be 4-component RGBA array' });
                    pass = false;
                } else {
                    messages.push({ type: 'pass', text: '✓ Tint format is 4-component RGBA' });
                }
                
                // Verify tint values are in valid range [0, 1]
                const allInRange = testTint.every(v => v >= 0 && v <= 1);
                if (!allInRange) {
                    messages.push({ type: 'fail', text: '✗ Tint values must be in range [0, 1]' });
                    pass = false;
                } else {
                    messages.push({ type: 'pass', text: '✓ Tint values in valid range [0, 1]' });
                }
                
                // Verify alpha is always 1.0 (no transparency modification)
                if (testTint[3] !== 1.0) {
                    messages.push({ type: 'fail', text: '✗ Tint alpha must be 1.0 (no transparency change)' });
                    pass = false;
                } else {
                    messages.push({ type: 'pass', text: '✓ Tint alpha is 1.0 (preserves transparency)' });
                }
                
                messages.push({ type: 'info', text: 'Integration checks:' });
                messages.push({ type: 'info', text: '  - Fragment shader must have "uniform vec4 u_tint;"' });
                messages.push({ type: 'info', text: '  - Shader must multiply texture color by tint' });
                messages.push({ type: 'info', text: '  - Plant.getRenderData() must return tint property' });
                messages.push({ type: 'info', text: '  - RenderSystem.renderPlant() must pass tint to shader' });
                messages.push({ type: 'pass', text: '✓ All integration requirements documented' });

                return { pass, messages };
            }
        );

        // Run all tests
        (async () => {
            const loaded = await suite.loadSpeciesConfig();
            if (!loaded) {
                document.getElementById('testResults').innerHTML = '<div class="test-section"><div class="test-title"><span class="test-status status-fail">ERROR</span></div><div class="test-details"><div class="fail">Failed to load species/nettles.json</div></div></div>';
                return;
            }

            await suite.runTests();
        })();
    </script>
