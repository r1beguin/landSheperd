<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sprite Cache Test - Land Shepherd</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 20px;
            background: #2d2d30;
            color: #cccccc;
        }
        h1 { color: #4ec9b0; }
        .test-section {
            background: #1e1e1e;
            padding: 15px;
            margin: 10px 0;
            border-left: 3px solid #4ec9b0;
        }
        .stats {
            background: #252526;
            padding: 10px;
            margin: 10px 0;
            font-family: 'Courier New', monospace;
        }
        .pass { color: #4ec9b0; }
        .fail { color: #f48771; }
        canvas {
            border: 1px solid #3e3e42;
            margin: 5px;
            background: #252526;
        }
    </style>
</head>
<body>
    <h1>Sprite Cache Test - Milestone 6</h1>
    <div id="output"></div>

    <!-- Load dependencies -->
    <script src="../../js/utils/color_utils.js"></script>
    <script src="../../js/utils/genetics_utils.js"></script>
    <script src="../../js/procedural/generators/base_generator.js"></script>
    <script src="../../js/procedural/generators/tree_generator.js"></script>
    <script src="../../js/procedural/generators/herb_generator.js"></script>
    <script src="../../js/procedural/generators/groundcover_generator.js"></script>
    <script src="../../js/procedural/plant_generator.js"></script>

    <script>
        const output = document.getElementById('output');
        
        function log(msg, className = '') {
            const div = document.createElement('div');
            div.className = className;
            div.textContent = msg;
            output.appendChild(div);
        }
        
        function logSection(title) {
            const section = document.createElement('div');
            section.className = 'test-section';
            section.innerHTML = `<h3>${title}</h3>`;
            output.appendChild(section);
            return section;
        }
        
        function displayStats() {
            const stats = PlantGenerator.getCacheStats();
            const div = document.createElement('div');
            div.className = 'stats';
            div.innerHTML = `
                Cache Size: ${stats.size} sprites<br>
                Cache Hits: ${stats.hits}<br>
                Cache Misses: ${stats.misses}<br>
                Hit Rate: ${stats.hitRate}
            `;
            output.appendChild(div);
        }
        
        // Mock species config
        const oakConfig = {
            id: 'quercus_robur',
            name: 'Oak',
            category: 'tree',
            growthStages: [
                { name: 'MatureTree', generator: 'matureTreeGeneration' }
            ],
            appearance: {
                dimensions: { width: 40, height: 50 },
                colorPalette: {
                    trunk: ['#5c4033', '#4a3326', '#3d2819'],
                    leaf: ['#2d5016', '#3d6b21', '#4d7f2a']
                }
            },
            proceduralModules: {
                trunk: { segments: 5 }
            }
        };
        
        // Test 1: Generate sprite at medium LOD
        logSection('Test 1: Initial Generation (Cache Miss Expected)');
        const sprite1 = PlantGenerator.generatePlantSprite(oakConfig, 'MatureTree', null, 'medium');
        log(`Generated sprite: ${sprite1.width}x${sprite1.height}`);
        displayStats();
        
        // Test 2: Generate same sprite (Cache Hit Expected)
        logSection('Test 2: Repeat Generation (Cache Hit Expected)');
        const sprite2 = PlantGenerator.generatePlantSprite(oakConfig, 'MatureTree', null, 'medium');
        log(`Generated sprite: ${sprite2.width}x${sprite2.height}`);
        log(sprite1 === sprite2 ? 'PASS: Same canvas object returned (cached)' : 'FAIL: Different canvas object', sprite1 === sprite2 ? 'pass' : 'fail');
        displayStats();
        
        // Test 3: Generate different LOD (Cache Miss Expected)
        logSection('Test 3: Different LOD Level (Cache Miss Expected)');
        const sprite3 = PlantGenerator.generatePlantSprite(oakConfig, 'MatureTree', null, 'high');
        log(`Generated sprite: ${sprite3.width}x${sprite3.height}`);
        log(`High LOD texture is larger: ${sprite3.width}x${sprite3.height} vs ${sprite1.width}x${sprite1.height}`, sprite3.width > sprite1.width ? 'pass' : 'fail');
        displayStats();
        
        // Test 4: Generate with genetics (Cache Miss Expected)
        logSection('Test 4: With Genetics (Cache Miss Expected)');
        const genetics = { widthFactor: 0.8, heightFactor: 1.2, foliageDensity: 0.6, colorTint: 0.5 };
        const sprite4 = PlantGenerator.generatePlantSprite(oakConfig, 'MatureTree', genetics, 'medium');
        log(`Generated sprite: ${sprite4.width}x${sprite4.height}`);
        displayStats();
        
        // Test 5: Repeat with same genetics (Cache Hit Expected)
        logSection('Test 5: Same Genetics (Cache Hit Expected)');
        const sprite5 = PlantGenerator.generatePlantSprite(oakConfig, 'MatureTree', genetics, 'medium');
        log(sprite4 === sprite5 ? 'PASS: Same canvas returned (cached with genetics)' : 'FAIL: Different canvas', sprite4 === sprite5 ? 'pass' : 'fail');
        displayStats();
        
        // Test 6: Cache hit rate validation
        logSection('Test 6: Cache Hit Rate Validation');
        const stats = PlantGenerator.getCacheStats();
        const expectedHitRate = 2; // Test 2 and Test 5
        const expectedMisses = 4;  // Test 1, 3, 4 (and initial misses)
        log(`Expected ~${expectedHitRate} hits, ~${expectedMisses} misses`);
        log(`Actual: ${stats.hits} hits, ${stats.misses} misses`);
        log(stats.hits >= 2 ? 'PASS: Cache is working' : 'FAIL: Cache not hitting', stats.hits >= 2 ? 'pass' : 'fail');
        
        // Display all sprites
        logSection('Visual Comparison');
        const container = document.createElement('div');
        container.innerHTML = `
            <p>Sprite 1 (Medium LOD):</p>
        `;
        container.appendChild(sprite1);
        container.innerHTML += `<p>Sprite 3 (High LOD - 2x resolution):</p>`;
        container.appendChild(sprite3);
        container.innerHTML += `<p>Sprite 4 (Medium LOD with genetics):</p>`;
        container.appendChild(sprite4);
        output.appendChild(container);
        
        // Final summary
        logSection('Summary');
        const finalStats = PlantGenerator.getCacheStats();
        log(`Total sprites in cache: ${finalStats.size}`);
        log(`Hit rate: ${finalStats.hitRate}`);
        log(`Expected cache keys: 4 (medium, high, medium+genetics, high reused)`);
        log(finalStats.size >= 3 ? 'PASS: Cache contains expected number of sprites' : 'FAIL: Cache size incorrect', finalStats.size >= 3 ? 'pass' : 'fail');
    </script>
</body>
</html>
